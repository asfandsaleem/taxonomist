[project]
name = "taxonomist"
version = "0.1.0"
description = "Generic taxonomy engine: constrained decisions-first tagging, audits, and residue-driven tree evolution."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
taxonomist = "taxonomist.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
